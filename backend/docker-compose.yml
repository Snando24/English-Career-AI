version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: english-career-postgres
    environment:
      POSTGRES_DB: english_career
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d english_career"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - english-career-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: english-career-redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - english-career-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: english-career-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@englishcareer.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - english-career-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  english-career-network:
    driver: bridge
