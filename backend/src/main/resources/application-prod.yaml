spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/english_career}
    username: ${DATABASE_USER:admin}
    password: ${DATABASE_PASSWORD:prod_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 600000
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  cache:
    type: redis
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: WARN
    com.englishcareer: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
  file:
    name: logs/english-career-api.log
    max-size: 10MB
    max-history: 30

jwt:
  secret: ${JWT_SECRET:change-me-in-production-12345678901234567890}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  metrics:
    export:
      simple:
        enabled: true
